<!DOCTYPE html>
<html lang="id">

<head>
    <title>Stikom Mart - Mobile Modern</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            padding-bottom: 80px;
        }

        .search-box {
            background-color: #f1f1f1;
            padding: 10px 14px;
            border-radius: 12px;
            width: 100%;
            border: none;
        }

        .cat-icon {
            width: 55px;
            height: 55px;
            background-color: #f1f1f1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            margin: auto;
        }

        .product-card {
            border-radius: 14px;
            overflow: hidden;
            background-color: #fff;
        }

        .product-card img {
            height: 140px;
            object-fit: cover;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: #ffffff;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 12px;
            z-index: 999;
        }

        .bottom-nav a {
            color: #777;
            text-decoration: none;
            text-align: center;
        }

        .bottom-nav a.active {
            color: #0d6efd;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold">Stikom Mart</span>
        </div>
    </nav>

    <!-- SEARCH -->
    <div class="container mt-3">
        <input type="text" class="search-box" placeholder="Cari produk...">
    </div>

    <!-- BANNER -->
    <div class="container mt-3">
        <div id="banner" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner rounded">
                <div class="carousel-item active">
                    <img src="{{ url_for('static', filename='img/banner.png') }}" class="d-block w-100"
                        style="height:150px; object-fit:cover;">
                </div>
            </div>
        </div>
    </div>

    <!-- KATEGORI -->
    <div class="container mt-4">
        <div class="row text-center g-3">
            <div class="col-3">
                <div class="cat-icon">👟</div>
                <small>Sepatu</small>
            </div>
            <div class="col-3">
                <div class="cat-icon">📱</div>
                <small>HP</small>
            </div>
            <div class="col-3">
                <div class="cat-icon">🎧</div>
                <small>Audio</small>
            </div>
            <div class="col-3">
                <div class="cat-icon">💻</div>
                <small>Laptop</small>
            </div>
        </div>
    </div>

    <!-- PRODUK -->
    <div class="container mt-4">
        <h6 class="fw-bold mb-2">Rekomendasi Untuk Anda</h6>

        <div class="row g-3">
            {% for product in products %}
            <div class="col-6">
                <div class="product-card shadow-sm">
                    <img src="/static/img/{{ product.image }}" class="w-100">
                    <div class="p-2">
                        <small class="fw-semibold d-block">{{ product.name }}</small>
                        <small class="text-primary fw-bold d-block">
                            Rp {{ product.price }}
                        </small>
                        <a href="/product/{{ product.id }}" class="btn btn-primary btn-sm w-100 mt-1">
                            Detail
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <a href="/" class="active">🏠<br>Home</a>
        <a href="/cart">🛒<br>Cart</a>
        <a href="/profile">👤<br>Profil</a>
    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
